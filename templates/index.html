<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FARFOR</title>
  <!-- CSS -->
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

  <!-- Navbar -->
  <header class="navbar-top">
    <div class="logo">FARFOR</div>
    <div class="user-cart">
      <button class="login">Войти</button>
      <button class="user-panel-btn">Личный кабинет</button>
      <button class="cart">Корзина (<span id="cart-count">0</span>)</button>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-content">
      <h1>FARFOR</h1>
      <p>Доставка вкусной еды прямо к вашему столу</p>
      <button class="order-now" id="showMenuBtn">Смотреть меню</button>
    </div>
  </section>

  <!-- Categories (пустой контейнер, заполнится динамически) -->
  <div class="categories" id="categoryFilter" style="display:none;">
    <!-- Категории появятся из БД -->
  </div>

  <!-- Products Grid (ПУСТОЙ контейнер, карточки товаров появятся из БД) -->
  <div class="products" id="productsGrid" style="display:none;">
    <!-- Товары загрузятся динамически из БД -->
  </div>

  <!-- Login Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close" id="closeLogin">&times;</span>
      <h2>Авторизация</h2>
      <input type="tel" id="phone" placeholder="Номер телефона">
      <button id="loginBtn">Войти</button>
    </div>
  </div>

  <!-- User Panel Modal (пустой контейнер) -->
  <div id="userPanel" class="modal">
    <!-- Содержимое появится динамически -->
  </div>

  <!-- Cart Modal -->
  <div id="cartModal" class="modal">
    <div class="modal-content cart-modal">
      <span class="close" id="closeCart">&times;</span>
      <!-- Контейнер для содержимого корзины -->
      <div id="cart-items-container"></div>
      <div id="ml-recommendations-container"></div>
    </div>
  </div>

  <!-- 
    ПОДКЛЮЧЕНИЕ СКРИПТОВ (ВАЖНЫЙ ПОРЯДОК!)
    Пути должны соответствовать вашей структуре папок
  -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/store.js"></script>
  <script src="/static/js/components.js"></script>
  <script src="/static/js/main.js"></script>

</body>

</html>
